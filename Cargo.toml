[package]
name = "thide"
version = "0.1.3"
edition = "2021"
authors = ["AmN"]
description = "A lightweight utility to hide/show Windows taskbar"
homepage = "https://github.com/amnweb/thide"
repository = "https://github.com/amnweb/thide"
license = "MIT"

[[bin]]
name = "thide"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = false

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
] }
tray-icon = "0.21"
winit = "0.29"
ico = "0.4"

[build-dependencies]
winres = "0.1"
